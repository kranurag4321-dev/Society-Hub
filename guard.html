<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Gate - Security Terminal</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #1a1a1a; color: white; padding: 20px; }
        .terminal { background: #2c3e50; padding: 30px; border-radius: 8px; max-width: 600px; margin: auto; border: 2px solid #7f8c8d; }
        input, select { width: 100%; padding: 12px; margin: 10px 0 20px 0; border-radius: 4px; border: none; box-sizing: border-box; }
        .btn-approve { background-color: #27ae60; color: white; border: none; padding: 15px; width: 48%; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .btn-deny { background-color: #c0392b; color: white; border: none; padding: 15px; width: 48%; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .directory { background: #34495e; padding: 15px; border-radius: 4px; margin-bottom: 20px; border-left: 5px solid #f1c40f; }
    </style>
</head>
<body>
    <div class="terminal">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 style="margin-top: 0; color: #f1c40f;">🛡️ GATE SECURITY TERMINAL</h2>
            <a href="/logout" style="color: #ff9999; text-decoration: none;">Logout</a>
        </div>
        
        <p><strong>Standard Operating Procedure:</strong> Call the resident for verbal confirmation before granting access.</p>

        <div class="directory">
            <h3 style="margin-top: 0; color: #ecf0f1;">Resident Directory (Call First)</h3>
            <ul style="margin: 0; padding-left: 20px; color: #bdc3c7;">
                <li><strong>Admin (Secretary):</strong> 555-0100</li>
                <li><strong>Flat 101:</strong> 555-0101</li>
            </ul>
        </div>

        <form action="/log_visitor" method="POST">
            <label><strong>Visitor Full Name:</strong></label>
            <input type="text" name="visitor_name" placeholder="e.g., Courier, Guest Name" required>
            
            <label><strong>Target Destination:</strong></label>
            <select name="flat_number" required>
                <option value="">Select Flat...</option>
                <option value="Admin">Admin / Office</option>
                <option value="Flat 101">Flat 101</option>
            </select>
            
            <div style="display: flex; justify-content: space-between;">
                <button type="submit" name="status" value="Approved" class="btn-approve">APPROVED (Called)</button>
                <button type="submit" name="status" value="Denied" class="btn-deny">DENIED</button>
            </div>
        </form>
    </div>
</body>
</html>
