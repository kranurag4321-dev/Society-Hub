<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Society Hub - Login</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 100%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0 20px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #1abc9c; color: white; border: none; padding: 15px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #16a085; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2 style="color: #2c3e50; margin-top: 0;">🏢 Society Hub Login</h2>
        <p>Please enter your credentials.</p>
        
        <form action="/login" method="POST">
            <div style="text-align: left;">
                <label><strong>Flat Number or Username:</strong></label>
                <input type="text" name="username" placeholder="e.g., Admin or Flat 101" required>
                
                <label><strong>Password:</strong></label>
                <input type="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit">Secure Login</button>
        </form>
    </div>

</body>
</html>
